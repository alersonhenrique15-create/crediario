<style>
:root{
  /* ---- cor de destaque da página (troque só esta linha) ----
     verde  37,211,102   |  laranja 255,138,42
     azul   56,152,255   |  roxo    168,110,255  |  vermelho 240,72,72 */
  --acc-rgb:37,211,102;
  --acc:rgb(var(--acc-rgb));

  --bg:#07090A; --ink:#F2F4F5; --ink-2:#A8AEB2; --ink-3:#71787C;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.055);
  --card:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.014));
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --m:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}

/* céu estrelado + brilho da cor de destaque */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(90% 55% at 50% -8%,rgba(var(--acc-rgb),.16),rgba(0,0,0,0) 62%),
    radial-gradient(70% 40% at 50% 104%,rgba(var(--acc-rgb),.08),rgba(0,0,0,0) 70%),
    var(--bg);}
.sky::after{content:"";position:absolute;inset:0;opacity:.75;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 9%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.1px 1.1px at 78% 6%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.2px 1.2px at 33% 21%,rgba(255,255,255,.32),transparent),
    radial-gradient(1px 1px at 88% 27%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.3px 1.3px at 6% 38%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 62% 44%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.2px 1.2px at 23% 58%,rgba(255,255,255,.28),transparent),
    radial-gradient(1px 1px at 92% 63%,rgba(255,255,255,.32),transparent),
    radial-gradient(1.4px 1.4px at 44% 74%,rgba(255,255,255,.26),transparent),
    radial-gradient(1px 1px at 15% 86%,rgba(255,255,255,.34),transparent),
    radial-gradient(1.1px 1.1px at 71% 91%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 52% 33%,rgba(255,255,255,.22),transparent);}

.wrap{max-width:470px;margin:0 auto;
  padding-left:max(17px,env(safe-area-inset-left,0px));
  padding-right:max(17px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

/* barra de cima */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 0;
  font:700 10px var(--m);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
.bar b{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.bar i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block;
  box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18)}
.bar .shut i{background:#D4982F;box-shadow:0 0 0 3px rgba(212,152,47,.16)}
.bar .shut{color:#C08E36}

/* topo */
.top{text-align:center;padding-top:26px}
.mark{display:flex;align-items:center;justify-content:center;gap:14px}
.mark .logo{width:62px;height:62px;flex:0 0 62px;border-radius:17px;padding:9px;display:grid;place-items:center;
  background:radial-gradient(125% 145% at 20% -12%,rgba(255,255,255,.18),rgba(255,255,255,0) 58%),linear-gradient(168deg,#1E2427,#0A0D0F);
  border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 30px -12px #000,inset 0 1px 0 rgba(255,255,255,.12)}
.mark .logo img{width:100%;display:block}
.mark .div{width:1px;height:38px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.22),transparent)}
.mark .selo{text-align:left;max-width:168px}
.mark .selo b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.mark .selo span{display:block;font-size:10px;color:var(--ink-3);font-weight:600;line-height:1.3;margin-top:2px}
.top h1{margin:17px 0 0;font-size:16.5px;font-weight:700;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
.top .handle{margin:9px 0 0;font:700 11px var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.top .aviso{margin:9px 0 0;font-size:12px;color:#C08E36;font-weight:600}

/* faixa de destaque */
.promo{position:relative;display:block;text-decoration:none;color:inherit;margin-top:24px;padding:17px 17px 15px;border-radius:17px;overflow:hidden;
  border:1px solid rgba(var(--acc-rgb),.42);
  background:linear-gradient(165deg,rgba(var(--acc-rgb),.17),rgba(var(--acc-rgb),.035) 58%,rgba(255,255,255,.015));
  box-shadow:0 18px 44px -22px rgba(var(--acc-rgb),.75),inset 0 1px 0 rgba(255,255,255,.08)}
.promo .eyebrow{display:inline-flex;align-items:center;gap:7px;font:700 9.5px var(--m);letter-spacing:.17em;text-transform:uppercase;color:var(--acc)}
.promo .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
.promo h2{margin:11px 0 0;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.14;max-width:16ch}
.promo p{margin:6px 0 0;font-size:13px;color:var(--ink-2);max-width:26ch}
.promo .cta{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(var(--acc-rgb),.22);
  font-size:13px;font-weight:700;color:var(--acc)}
.promo .cta svg{width:14px;height:14px;flex:0 0 14px}
.promo .fones{position:absolute;right:-4px;top:50%;transform:translateY(-54%);width:134px;opacity:1;pointer-events:none}
@media (max-width:400px){.promo .fones{opacity:.42;right:-26px}}

/* seções */
.sec{margin-top:28px}
.sec > header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 3px 10px;
  font:700 10px var(--m);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
.sec > header b{color:var(--ink-2);font-weight:700}
.sec > header b em{font-style:normal;color:var(--acc);margin-right:4px}
.list{display:grid;gap:10px}

/* cartões */
.item{position:relative;display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
  padding:14px 40px 14px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease}
.item:active{transform:scale(.985)}
.item .ar{position:absolute;top:11px;right:12px;width:15px;height:15px;color:var(--ink-3)}
.item .ar svg{width:100%;height:100%;display:block}
.item .av{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  font:800 15.5px var(--f);letter-spacing:.01em;background:rgba(255,255,255,.055);color:var(--ink-2);border:1px solid var(--line)}
.item .av svg{width:20px;height:20px;display:block}
.item .tx{min-width:0;flex:1}
.item .tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.012em;line-height:1.25}
.item .tx > span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tag{font:700 9px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);
  border:1px solid rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.12);padding:2px 6px;border-radius:5px;margin-left:7px;vertical-align:2px}

/* cartão ativo (com brilho) */
.item.on{border-color:rgba(var(--acc-rgb),.42);
  background:linear-gradient(170deg,rgba(var(--acc-rgb),.13),rgba(var(--acc-rgb),.025) 70%,rgba(255,255,255,.012));
  box-shadow:0 14px 34px -22px rgba(var(--acc-rgb),.85),inset 0 1px 0 rgba(255,255,255,.07)}
.item.on .av{background:linear-gradient(158deg,rgba(var(--acc-rgb),1),rgba(var(--acc-rgb),.62));color:#05230F;border-color:transparent;
  box-shadow:0 6px 16px -8px rgba(var(--acc-rgb),.9)}
.item.on .ar{color:var(--acc)}
@media (hover:hover){.item:hover{border-color:rgba(var(--acc-rgb),.55)}}

/* cartão apagado (falta dado) */
.item.off{opacity:.42;pointer-events:none}

footer{margin-top:30px;text-align:center;font:600 10px var(--m);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);line-height:1.9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function wa(n,t){return "https://api.whatsapp.com/send?phone="+n+"&text="+encodeURIComponent(t||"");}
function num2(n){var d=String(n||"").replace(/\D/g,"");return d.length>=12?d:"";}
function pad(n){return (n<10?"0":"")+n;}

/* ---------- topo ---------- */
document.getElementById("seloT").textContent  = LOJA.seloTitulo || "";
document.getElementById("seloS").textContent  = LOJA.seloSub || "";
document.getElementById("tagline").textContent= LOJA.tagline || "";
document.getElementById("handle").textContent = LOJA.handle || "";
document.getElementById("rodape").textContent = LOJA.rodape || "";

/* ---------- aberto / fechado ---------- */
function agora(){
  try{
    var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()),o={};
    p.forEach(function(x){o[x.type]=x.value;});
    var dd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    return {d:dd[o.weekday],m:(parseInt(o.hour,10)%24)*60+parseInt(o.minute,10)};
  }catch(e){var x=new Date();return {d:x.getDay(),m:x.getHours()*60+x.getMinutes()};}
}
function mm(h){var a=h.split(":");return (+a[0])*60+(+a[1]);}
function hl(h){var a=h.split(":");return (+a[0])+(a[1]==="00"?"h":"h"+a[1]);}
var DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

(function(){
  var a=agora(), hoje=HORARIO[a.d]||[], aberta=null, i;
  for(i=0;i<hoje.length;i++) if(a.m>=mm(hoje[i][0])&&a.m<mm(hoje[i][1])) aberta=hoje[i];
  var st=document.getElementById("status"), av=document.getElementById("aviso");
  if(aberta){
    st.innerHTML='<b><i></i>Aberta agora</b>';
  }else{
    st.innerHTML='<b class="shut"><i></i>Fechada agora</b>';
    var prox=null;
    for(i=0;i<hoje.length;i++) if(a.m<mm(hoje[i][0])){prox={q:"hoje",h:hoje[i][0]};break;}
    if(!prox) for(var k=1;k<=7;k++){var d=(a.d+k)%7,f=HORARIO[d]||[];if(f.length){prox={q:(k===1?"amanhã":DIAS[d]),h:f[0][0]};break;}}
    if(prox){ av.textContent="Abre "+prox.q+" às "+hl(prox.h)+" · pode mandar mensagem"; av.hidden=false; }
  }
})();

/* ---------- faixa de destaque ---------- */
if (DESTAQUE){
  var alvo = DESTAQUE.link ? (LOJA[DESTAQUE.link]||"") : (DESTAQUE.url||"");
  if (alvo){
    var pr=document.getElementById("promo");
    pr.href=alvo;
    if(DESTAQUE.link!=="ficha"){pr.target="_blank";pr.rel="noopener";}
    pr.innerHTML = '<span class="fones">'+IC.fones+'</span>'+
      '<span class="eyebrow"><i></i>'+esc(DESTAQUE.etiqueta||"")+'</span>'+
      '<h2>'+esc(DESTAQUE.titulo||"")+'</h2>'+
      '<p>'+esc(DESTAQUE.texto||"")+'</p>'+
      '<span class="cta">'+IC.baixo+esc(DESTAQUE.cta||"")+'</span>';
    pr.hidden=false;
  }
}

/* ---------- lista ---------- */
function card(it){
  var href="", novaAba=true, off=false;
  if(it.link){
    href = LOJA[it.link]||"";
    if(!href) off=true;
    if(it.link==="ficha") novaAba=false;
  }else{
    var n=num2(it.numero);
    if(!n) off=true; else href=wa(n,it.msg);
  }
  var ini = String(it.nome).replace(/^(comprar com (a|o) )/i,"").trim().charAt(0).toUpperCase();
  var av  = it.icone ? IC[it.icone] : (/[A-ZÀ-Ú]/.test(ini) ? esc(ini) : IC.pessoa);
  var sub = off ? (it.link?"falta o link":"falta o número do WhatsApp") : (it.sub||"");
  var tag = it.tag ? '<span class="tag">'+esc(it.tag)+'</span>' : "";
  var on  = !off && !it.link;              /* cartões de WhatsApp ficam acesos */
  if(!off && it.link==="grupo") on=true;

  return '<a class="item'+(on?" on":"")+(off?" off":"")+'" href="'+esc(off?"#":href)+'"'+
         (!off&&novaAba?' target="_blank" rel="noopener"':'')+(off?' aria-disabled="true" tabindex="-1"':'')+'>'+
           '<span class="av">'+av+'</span>'+
           '<span class="tx"><b>'+esc(it.nome)+tag+'</b><span>'+esc(sub)+'</span></span>'+
           '<span class="ar">'+IC.seta+'</span></a>';
}

var html="", n=0;
SECOES.forEach(function(s){
  var itens=ITENS.filter(function(i){return i.sec===s.id;});
  if(!itens.length) return;
  n++;
  html+='<section class="sec"><header><b><em>[ '+pad(n)+' ]</em>· '+esc(s.titulo)+'</b>'+
        '<span>'+itens.length+' '+esc(s.unidade||"links")+'</span></header>'+
        '<div class="list">'+itens.map(card).join("")+'</div></section>';
});
document.getElementById("secoes").innerHTML=html;
</script>
