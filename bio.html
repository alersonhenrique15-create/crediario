<style>
/* ====== mesmas cores e fontes da ficha de crediário ====== */
:root{
  --bg:#F2F3F4; --card:#FFFFFF; --field:#F4F5F6; --ink:#0A0C0D; --ink-2:#474B4E; --ink-3:#7C8084;
  --rule:#DFE1E3;
  --accent:#1B1F21; --accent-soft:#E4E6E8;
  --ok:#2E7D52; --ok-soft:#E2EFE8; --ok-line:#9CCBB0;
  --warn:#96681A; --warn-soft:#F6ECD9; --warn-line:#E2C690;
  --wa:#25D366; --wa-ink:#062512;
  --metal:linear-gradient(168deg,#2A3135 0%,#141A1D 46%,#0B0E10 100%);
  --metal-edge:rgba(255,255,255,.14);
  --shadow:0 1px 2px rgba(11,16,20,.05),0 10px 28px -14px rgba(11,16,20,.22);
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0C0D; --card:#14171A; --field:#101315; --ink:#E9ECEE; --ink-2:#B3B8BC; --ink-3:#82888C;
  --rule:#24282B; --accent:#C7CDD1; --accent-soft:#1E2225;
  --ok:#5FB886; --ok-soft:#142619; --ok-line:#2C5A3E;
  --warn:#D4982F; --warn-soft:#2A2213; --warn-line:#5E4718;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.72);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0C0D; --card:#14171A; --field:#101315; --ink:#E9ECEE; --ink-2:#B3B8BC; --ink-3:#82888C;
  --rule:#24282B; --accent:#C7CDD1; --accent-soft:#1E2225;
  --ok:#5FB886; --ok-soft:#142619; --ok-line:#2C5A3E;
  --warn:#D4982F; --warn-soft:#2A2213; --warn-line:#5E4718;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.72);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);font-weight:800;margin:0;letter-spacing:-.02em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* topo */
.top{text-align:center;padding-block:30px 6px}
.logo{width:78px;height:78px;margin:0 auto;border-radius:22px;background:radial-gradient(125% 145% at 20% -12%,rgba(255,255,255,.2),rgba(255,255,255,0) 58%),linear-gradient(168deg,#1E2427 0%,#0A0D0F 100%);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;padding:12px;box-shadow:0 10px 26px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.13)}
.logo img{width:100%;height:auto;display:block}
.top h1{font-size:25px;margin-top:14px;letter-spacing:.04em}
.top .sub{margin:6px 0 0;font-size:14px;color:var(--ink-2);text-wrap:balance}
.top .loc{margin:3px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}

/* aberto / fechado */
.status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid}
.status .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.status.open{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.status.open .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.status.shut{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.status.shut .dot{background:var(--warn)}

/* chamada */
.lead{margin:26px 0 0;text-align:center;font-size:15px;color:var(--ink-2);font-weight:600}

/* grupos */
.group{margin-top:22px}
.group > h2{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-left:4px;margin-bottom:9px}
.list{display:grid;gap:9px}

/* cada botão */
.item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.item:active{transform:scale(.985)}
@media (hover:hover){.item:hover{border-color:var(--wa)}}
.item .av{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:grid;place-items:center;font:800 15px var(--f-display);letter-spacing:.02em;background:var(--metal);color:#fff;box-shadow:inset 0 1px 0 var(--metal-edge)}
.item .av svg{width:22px;height:22px;display:block}
.item .tx{min-width:0;flex:1}
.item .tx b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.item .tx > span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .go{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--wa);color:var(--wa-ink)}
.item .go svg{width:17px;height:17px;display:block}
.item.alt .go{background:var(--accent-soft);color:var(--ink-2)}
.item.off{opacity:.55;pointer-events:none}
.item.off .go{background:var(--accent-soft);color:var(--ink-3)}
.item .tag{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--wa-ink);background:var(--wa);padding:2px 7px;border-radius:5px;margin-left:7px;vertical-align:1px}

/* destaque */
.item.hero{background:var(--metal);border-color:transparent;color:#F2F4F5}
.item.hero .tx b{color:#fff}
.item.hero .tx > span{color:rgba(255,255,255,.66)}
.item.hero .av{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}

footer{margin-top:28px;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.6}
footer a{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function iniciais(n){ var p=String(n||"").trim().split(/\s+/); return ((p[0]||"")[0]||"").toUpperCase()+((p[1]||"")[0]||"").toUpperCase(); }
function waHref(num,texto){ return "https://api.whatsapp.com/send?phone="+num+"&text="+encodeURIComponent(texto||""); }
function fone(num){
  var d=String(num||"").replace(/\D/g,"");
  var m=d.match(/^(\d{2})(\d{2})(\d{4,5})(\d{4})$/);
  return m ? "+"+m[1]+" ("+m[2]+") "+m[3]+"-"+m[4] : d;
}

    var p = new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
    var o={}; p.forEach(function(x){ o[x.type]=x.value; });
    var dias={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    return { dia:dias[o.weekday], min:parseInt(o.hour,10)%24*60 + parseInt(o.minute,10) };
  }catch(e){
    var d=new Date(); return { dia:d.getDay(), min:d.getHours()*60+d.getMinutes() };
  }
}
function min(hhmm){ var a=hhmm.split(":"); return (+a[0])*60 + (+a[1]); }
function hLabel(hhmm){ var a=hhmm.split(":"); return (+a[0]) + (a[1]==="00" ? "h" : "h"+a[1]); }
var NOMEDIA=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

function pintaStatus(){
  var alvo=document.getElementById("status");
  if(!HORARIO){ return; }
  var ag=horaLoja(), hoje=HORARIO[ag.dia]||[], aberto=null;
  for(var i=0;i<hoje.length;i++){ if(ag.min>=min(hoje[i][0]) && ag.min<min(hoje[i][1])) aberto=hoje[i]; }

  var html;
  if(aberto){
    html='<div class="status open"><span class="dot"></span>Aberto agora · fecha às '+hLabel(aberto[1])+'</div>';
  }else{
    /* ainda abre hoje? */
    var prox=null;
    for(var j=0;j<hoje.length;j++){ if(ag.min < min(hoje[j][0])){ prox={quando:"hoje",hora:hoje[j][0]}; break; } }
    if(!prox){
      for(var k=1;k<=7;k++){
        var d=(ag.dia+k)%7, f=HORARIO[d]||[];
        if(f.length){ prox={quando:(k===1?"amanhã":NOMEDIA[d]),hora:f[0][0]}; break; }
      }
    }
    html='<div class="status shut"><span class="dot"></span>Fechado agora'+(prox?' · abre '+prox.quando+' às '+hLabel(prox.hora):'')+'</div>';
  }
  alvo.innerHTML = html + (aberto ? "" : "");
}
pintaStatus();

/* ---- botões ---- */
function cardHTML(it){
  var destino = "", externo = true, off = false;

  if (it.link) {                        /* link que não é WhatsApp */
    destino = LOJA[it.link] || "";
    if (!destino) off = true;
    if (it.link === "ficha") externo = false;
  } else {                              /* WhatsApp */
    var num = String(it.numero||"").replace(/\D/g,"");
    if (num.length < 12) off = true; else destino = waHref(num, it.msg);
  }

  var ic = it.icone ? ICONES[it.icone] : null;
  var av = ic ? ic : esc(iniciais(it.nome));
  var sub = it.cargo || "";
  if (!it.link && !off) sub = sub ? sub : fone(it.numero);
  if (off) sub = it.link ? "falta o link" : "falta o número do WhatsApp";

  var cls = "item" + (it.destaque?" hero":"") + (it.alt?" alt":"") + (off?" off":"");
  var tag = it.tag ? '<span class="tag">'+esc(it.tag)+'</span>' : "";
  var go  = (it.link || it.alt) ? ICONES.seta : ICONES.whats;

  return '<a class="'+cls+'" href="'+esc(off?"#":destino)+'"'+(externo&&!off?' target="_blank" rel="noopener"':'')+
         (off?' aria-disabled="true" tabindex="-1"':'')+'>'+
           '<span class="av">'+av+'</span>'+
           '<span class="tx"><b>'+esc(it.nome)+tag+'</b><span>'+esc(sub)+'</span></span>'+
           '<span class="go">'+go+'</span>'+
         '</a>';
}

var out = "";
GRUPOS.forEach(function(g){
  var itens = ITENS.filter(function(i){ return i.grupo === g.id; });
  if (!itens.length) return;
  out += '<section class="group"><h2>'+esc(g.titulo)+'</h2><div class="list">'+
         itens.map(cardHTML).join("") + '</div></section>';
});
document.getElementById("grupos").innerHTML = out;
</script>
